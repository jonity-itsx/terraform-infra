name: Terraform PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: team

jobs:
  terraform-checks:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # team/bootstrap/ är en egen root-modul med eget backend-block.
      # terraform validate i team/ tittar inte in i den.
      - name: Terraform Init (bootstrap)
        run: terraform init -backend=false
        working-directory: team/bootstrap

      - name: Terraform Validate (bootstrap)
        run: terraform validate
        working-directory: team/bootstrap

  tflint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # Hämtar google-pluginet en gång; det cachas sedan för båda körningarna.
      - name: TFLint Init
        run: tflint --init

      - name: TFLint (team)
        run: tflint --format compact

      # always(): annars hoppas steget över när team/ har fynd, och vi får
      # aldrig se om bootstrap också har några.
      - name: TFLint (bootstrap)
        if: always()
        run: tflint --format compact
        working-directory: team/bootstrap

  # Säkerhetsskanning av Terraform-koden. Trivy hämtas som binär med fast
  # version och kontrollerad checksumma, samma som i company-website.
  # Avsiktliga undantag står som #trivy:ignore direkt i koden, med motivering.
  # Skannar från roten, så att sökvägarna i SARIF blir team/main.tf osv.
  trivy-config:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Alla nivåer till Security-fliken, så att MEDIUM och LOW syns utan
      # att stoppa PR:en.
      - name: Trivy report
        run: trivy config --format sarif --output trivy-config.sarif .

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # Spärren: CRITICAL och HIGH stoppar PR:en.
      - name: Trivy gate
        run: trivy config --severity CRITICAL,HIGH --exit-code 1 .

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CICD_PLAN_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Terraform Init
        run: terraform init

      # -lock=false: flera PR-planer kan köra samtidigt utan att blockera
      # varandra eller deployen. Planen appliceras aldrig härifrån.
      - name: Terraform Plan
        run: terraform plan -input=false -lock=false -no-color
