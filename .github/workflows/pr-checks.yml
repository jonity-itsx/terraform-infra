name: Terraform PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: team

jobs:
  terraform-checks:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # team/bootstrap/ är en egen root-modul med eget backend-block.
      # terraform validate i team/ tittar inte in i den.
      - name: Terraform Init (bootstrap)
        run: terraform init -backend=false
        working-directory: team/bootstrap

      - name: Terraform Validate (bootstrap)
        run: terraform validate
        working-directory: team/bootstrap

  tflint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # Hämtar google-pluginet en gång; det cachas sedan för båda körningarna.
      - name: TFLint Init
        run: tflint --init

      - name: TFLint (team)
        run: tflint --format compact

      # always(): annars hoppas steget över när team/ har fynd, och vi får
      # aldrig se om bootstrap också har några.
      - name: TFLint (bootstrap)
        if: always()
        run: tflint --format compact
        working-directory: team/bootstrap

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform Init
        run: terraform init

      # -lock=false: flera PR-planer kan köra samtidigt utan att blockera
      # varandra eller deployen. Planen appliceras aldrig härifrån.
      - name: Terraform Plan
        run: terraform plan -input=false -lock=false -no-color
